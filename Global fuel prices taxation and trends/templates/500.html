{% extends "base.html" %}

{% block title %}Server Error (500) - Global Fuel Analytics{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-3">500</div>
        <h2 class="fw-bold text-navy mb-2">Internal Server Error</h2>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            An unexpected error occurred while processing your request. Please try reloading or check the application logs.
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-primary px-4 py-2" style="background-color: #0d9488; border-color: #0d9488;">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
