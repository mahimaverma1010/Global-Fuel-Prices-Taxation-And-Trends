{% extends "base.html" %}

{% block title %}Page Not Found (404) - Global Fuel Analytics{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-teal mb-3">404</div>
        <h2 class="fw-bold text-navy mb-2">Page Not Found</h2>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            The page you are looking for might have been moved, removed, or is temporarily unavailable.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('home') }}" class="btn btn-primary px-4 py-2" style="background-color: #0d9488; border-color: #0d9488;">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary px-4 py-2">
                <i class="bi bi-speedometer2 me-1"></i> Open Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
